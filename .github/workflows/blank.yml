name: Build Marp slides

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Build HTML slides with Marp
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p slides

          for input_file in _slides_src/*.md; do
            # Skip if no Markdown files exist
            [ -f "$input_file" ] || continue

            filename=$(basename "$input_file" .md)
            output_file="slides/${filename}.html"

            echo "Building: $input_file"

            marp \
              --html \
              --output "$output_file" \
              "$input_file"

            echo "Generated: $output_file"
          done

      - name: Commit generated slides
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Build Marp slides"
          file_pattern: slides/*.html
          add_options: "-f"
